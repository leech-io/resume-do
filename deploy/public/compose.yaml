name: xiachen-public
services:
  gateway:
    image: ${CADDY_IMAGE:-mirror.ccs.tencentyun.com/library/caddy:2}
    restart: unless-stopped
    # Linux host networking reaches the existing loopback-only application ports.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/ubuntu/xiachen-public/extra:/etc/caddy/extra:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  caddy_data:
    name: xiachen_public_caddy_data
  caddy_config:
    name: xiachen_public_caddy_config
